[package]
name = "cpxm"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Reusable authenticated proximity (placeholder): proof of physical presence, for example via an NFC tag"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cpxm"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
hex = "0.4"
cfbk = { git = "https://git.corbet.ch/corbet-foss/cfbk", branch = "main" }
ntag424 = { version = "0.1", default-features = false, features = ["sdm", "alloc"] }
geographiclib-rs = "0.2"
hmac = "0.13"
sha2 = "0.11"
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
futures = "0.3"
